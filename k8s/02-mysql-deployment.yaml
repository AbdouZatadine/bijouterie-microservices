apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: database
spec: 
  replicas: 1
  selector:
    matchLabels:
      app: bijouterie
      tier: database
  template:
    metadata:
      labels:
        app: bijouterie
        tier: database
    spec:
      containers:
      - name: mysql
        image: zatadineabdou/bijouterie-mysql:1
        ports:
        - containerPort: 3306
        envFrom:
        - secretRef:                # ← espace après le tiret + "secretRef" (pas "secreteRef")
            name: mysql-secret      # ← décalé sous secretRef
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:                   # ← "limits" (pas "limite")
            memory: "1Gi"           # ← rangés SOUS limits,
            cpu: "500m"             #   comme sous requests