apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bijouterie
  labels:
    app: bijouterie
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bijouterie
      tier: frontend
  template:
    metadata:
      labels:
        app: bijouterie
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: zatadineabdou/bijouterie-frontend:1
        ports:
        - containerPort: 80
        envFrom:                    
        - configMapRef:             
            name: frontend-config
        livenessProbe:
          httpGet:
            path: /healthz      
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:             
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:                  
          requests:
            cpu: 100m
            memory: 128Mi
          limits:                  
            cpu: 500m
            memory: 256Mi