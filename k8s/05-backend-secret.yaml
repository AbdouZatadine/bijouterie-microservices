apiVersion: v1
kind: Secret # ici on a le secret du backend, pour ses identifiants de connexion a mysql
metadata:
  name: backend-secret # on l'appelle backend-secret
  namespace : bijouterie
  labels :
    app: bijouterie
    tier : backend # il concerne le backend
type : Opaque
stringData : 
  DB_USER : Zatadine # le meme utilisateur que MYSQL_USER, sinon mysql refuse la connexion
  DB_PASSWORD : connexion # le meme mot de passe que MYSQL_PASSWORD
