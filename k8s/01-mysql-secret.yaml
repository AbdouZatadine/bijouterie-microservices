apiVersion: v1
kind: Secret # ici on a un secret, on y met les infos sensibles comme le mots de passe
metadata:
  name: mysql-secret # on l'appelle mysql secret, c'est avec ce nom que le deployment mysql le retrouve
  namespace : bijouterie # on le met dans le namespace du projet
  labels :
    app: bijouterie
    tier : database 
type : Opaque #  le type de secret classique, on met ce qu'on veut en cle  valeur
stringData : # ici on ecrit les valeurs en clair, kubernetes les encode en base64 tout seul
   MYSQL_ROOT_PASSWORD :  Zata # le mot de passe de root, c'est le compte admin de mysql
   MYSQL_DATABASE : bijouterie_db # la base que mysql va creer au premier demarrage
   MYSQL_USER : Zatadine # l'utilisateur de l'appli, c'est avec lui que le backend se connecte
   MYSQL_PASSWORD : connexion # son mot de passe, on doit avoir le meme dans DB_PASSWORD du backend
